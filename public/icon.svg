<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#450a0a" />
      <stop offset="65%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="45%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable & square icon compatibility -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Subtle inner soundwave ring inside 76% maskable safe zone -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ef4444" stroke-opacity="0.16" stroke-width="6" />
  <circle cx="256" cy="256" r="142" fill="#18181b" fill-opacity="0.65" stroke="#ef4444" stroke-opacity="0.35" stroke-width="4" />

  <!-- Red Studio Microphone Capsule (centered within safe zone) -->
  <rect x="210" y="132" width="92" height="148" rx="46" fill="url(#micGrad)" />

  <!-- Microphone Grille Highlights -->
  <line x1="226" y1="176" x2="250" y2="176" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />
  <line x1="262" y1="176" x2="286" y2="176" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />
  <line x1="226" y1="202" x2="250" y2="202" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />
  <line x1="262" y1="202" x2="286" y2="202" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />
  <line x1="226" y1="228" x2="250" y2="228" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />
  <line x1="262" y1="228" x2="286" y2="228" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.55" />

  <!-- U-shaped Cradle Arc -->
  <path
    d="M174 236v18c0 45.287 36.713 82 82 82s82-36.713 82-82v-18"
    fill="none"
    stroke="url(#standGrad)"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Vertical Stand & Base -->
  <line x1="256" y1="336" x2="256" y2="380" stroke="url(#standGrad)" stroke-width="18" stroke-linecap="round" />
  <line x1="208" y1="382" x2="304" y2="382" stroke="url(#standGrad)" stroke-width="18" stroke-linecap="round" />
</svg>
